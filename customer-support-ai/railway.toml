# railway.toml — Deploy backend to Railway
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "techmart-ai-backend"

[services.variables]
PORT = "8000"
KNOWLEDGE_BASE_DIR = "knowledge_base"
VECTORSTORE_PATH = "backend/vectorstore"
EMBEDDING_MODEL = "all-MiniLM-L6-v2"
# Set ANTHROPIC_API_KEY and SECRET_KEY in Railway dashboard!
